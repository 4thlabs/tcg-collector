services:
  collector:
    # Image published by the CI on every commit to main; "build" is the fallback to build locally.
    image: ghcr.io/4thlabs/tcg-collector:latest
    build: .
    restart: unless-stopped
    environment:
      COLLECT_AT: "12:00"   # daily collection time, UTC
      GAMES: "all"          # or a list, e.g. "1,21" for Magic and Star Wars Unlimited
    volumes:
      - ./data:/app/data
