services:
  collector:
    # Image publiée par la CI à chaque commit sur main ; « build » sert de repli pour construire en local.
    image: ghcr.io/4thlabs/tcg-collector:latest
    build: .
    restart: unless-stopped
    environment:
      COLLECT_AT: "12:00"   # heure UTC de la collecte quotidienne
      GAMES: "all"          # ou une liste, ex. "1,21" pour Magic et Star Wars Unlimited
    volumes:
      - ./data:/app/data
