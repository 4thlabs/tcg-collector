services:
  collector:
    # Image published by the CI on every commit to main; "build" is the fallback to build locally.
    image: ghcr.io/4thlabs/tcg-collector:latest
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      COLLECT_AT: "12:00"   # daily collection time, UTC
      GAMES: "all"          # or a list, e.g. "1,21" for Magic and Star Wars Unlimited
      IMPORT_GAMES: "1,21"  # games imported into the database after each collection (empty: the collected games)
      LOG_LEVEL: "info"     # error, warn, info or debug
      LOG_FORMAT: "text"    # or "json" for a log collector
      # Remove DATABASE_URL to only collect, without importing.
      DATABASE_URL: "postgres://tcg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/tcg"
    volumes:
      - ./data:/app/data

  # PostgreSQL 17 with TimescaleDB. The collector creates the tables and the hypertable on its first import.
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    restart: unless-stopped
    ports:
      - "5432:5432"         # for Grafana, psql or the analyser
    environment:
      POSTGRES_USER: "tcg"
      POSTGRES_DB: "tcg"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      TIMESCALEDB_TELEMETRY: "off"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tcg", "-d", "tcg"]
      interval: 10s
      retries: 10
    volumes:
      - ./timescaledb:/var/lib/postgresql/data
