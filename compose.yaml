services:
  tcg-collector:
    container_name: tcg-collector
    # Image published by the CI on every commit to main; "build" is the fallback to build locally.
    image: ghcr.io/4thlabs/tcg-collector:latest
    build: .
    restart: unless-stopped
    depends_on:
      - tcg-collector-influxdb
    environment:
      COLLECT_AT: "12:00"   # daily collection time, UTC
      GAMES: "all"          # or a list, e.g. "1,21" for Magic and Star Wars Unlimited
      IMPORT_GAMES: "1,21"  # games imported into InfluxDB after each collection (empty: the collected games)
      LOG_LEVEL: "info"     # error, warn, info or debug
      LOG_FORMAT: "text"    # or "json" for a log collector
      # Remove INFLUX_URL to only collect, without importing.
      INFLUX_URL: "http://tcg-collector-influxdb:8181"
      INFLUX_DATABASE: "cardmarket"
      INFLUX_TOKEN: "${TCG_COLLECTOR_INFLUX_TOKEN:?set TCG_COLLECTOR_INFLUX_TOKEN in .env}"
    volumes:
      - ./data:/app/data

  # Card page (search a card, latest and daily prices), same image: http://<host>:8080/
  tcg-collector-web:
    container_name: tcg-collector-web
    image: ghcr.io/4thlabs/tcg-collector:latest
    build: .
    restart: unless-stopped
    command: ["node", "src/cli.ts", "serve"]
    depends_on:
      - tcg-collector-influxdb
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: "info"
      INFLUX_URL: "http://tcg-collector-influxdb:8181"
      INFLUX_DATABASE: "cardmarket"
      INFLUX_TOKEN: "${TCG_COLLECTOR_INFLUX_TOKEN:?set TCG_COLLECTOR_INFLUX_TOKEN in .env}"
    # Card images fetched from Scryfall are kept in ./data/images.
    volumes:
      - ./data:/app/data

  # InfluxDB 3 Core, Parquet files in ./influxdb. The database is created by the first write.
  tcg-collector-influxdb:
    container_name: tcg-collector-influxdb
    image: influxdb:3-core
    restart: unless-stopped
    ports:
      - "8181:8181"         # HTTP API (write, SQL and InfluxQL queries), e.g. for Grafana
    environment:
      INFLUX_TOKEN: "${TCG_COLLECTOR_INFLUX_TOKEN:?set TCG_COLLECTOR_INFLUX_TOKEN in .env}"
      # One write a day: persist to Parquet after every 10 WAL files instead of 600, so the data leaves
      # memory the same day, and keep few WAL files once persisted.
      INFLUXDB3_WAL_FILES_PER_SNAPSHOT: "10"
      INFLUXDB3_SNAPSHOTTED_WAL_FILES_TO_KEEP: "10"
      # Core has no compaction: one Parquet file per day of prices, and a query reads one file per day it covers.
      # The default limit is sized for recent data; raised so queries can cover years of daily prices.
      INFLUXDB3_QUERY_FILE_LIMIT: "10000"
    # The admin token comes from .env: written to a token file that InfluxDB loads on its first start.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        umask 077 &&
        printf '{"token":"%s","name":"_admin"}' "$$INFLUX_TOKEN" > /tmp/admin-token.json &&
        exec influxdb3 serve --node-id nas --object-store file --data-dir /var/lib/influxdb3
        --admin-token-file /tmp/admin-token.json
    volumes:
      - ./influxdb:/var/lib/influxdb3
